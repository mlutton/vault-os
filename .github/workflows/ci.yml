name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  scrub-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No personal paths in the tree
        run: |
          # Pattern assembled at runtime so this file never matches itself.
          pattern="/home/mich"
          pattern="${pattern}ael"
          if grep -rn "$pattern" --exclude-dir=.git .; then
            echo "::error::Personal absolute paths found — scrub before merge."
            exit 1
          fi
          echo "clean"

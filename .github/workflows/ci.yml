name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  pr-shape:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: PR body follows the template
        run: |
          fail=0
          for h in "## Summary" "## Evidence" "## Acceptance criteria → proof" "## Design notes"; do
            if ! grep -qF "$h" <<<"$PR_BODY"; then
              echo "::error::PR body missing required section: $h"
              fail=1
            fi
          done
          # At least one filled criteria row (a table line with content beyond bars/spaces,
          # not the header or divider).
          if ! grep -E '^\|[^|-]*[A-Za-z0-9][^|]*\|' <<<"$PR_BODY" | grep -vqE 'Criterion|^[| :-]+$'; then
            echo "::error::Acceptance criteria table has no filled rows."
            fail=1
          fi
          exit $fail

  scrub-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No personal paths in the tree
        run: |
          # Pattern assembled at runtime so this file never matches itself.
          pattern="/home/mich"
          pattern="${pattern}ael"
          if grep -rn "$pattern" --exclude-dir=.git .; then
            echo "::error::Personal absolute paths found — scrub before merge."
            exit 1
          fi
          echo "clean"
